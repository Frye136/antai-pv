# Publication d'une version : pousser un tag « vX.Y.Z » identique à app/config.py (VERSION).
#   git tag v1.5.0 && git push origin v1.5.0
# -> tests, construction de AntaiPV.exe, empreinte SHA-256, release GitHub avec les notes du CHANGELOG.
# Les logiciels installés la détectent au démarrage (mise à jour automatique).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Dépendances
        run: python -m pip install -r requirements.txt

      - name: Le tag correspond à la version du code
        shell: pwsh
        run: |
          $v = python -c "from app import config; print(config.VERSION)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} différent de config.VERSION ($v)" }

      - name: Tests
        run: python tests/test_core.py

      - name: Construction de l'exécutable
        run: python -m PyInstaller --noconfirm --clean AntaiPV.spec

      - name: L'exécutable démarre (test de fumée)
        shell: pwsh
        run: |
          $out = Join-Path $env:TEMP "antaipv_diagnostic.txt"
          Remove-Item $out -ErrorAction SilentlyContinue
          $p = Start-Process dist/AntaiPV.exe -ArgumentList "--diagnostic","--quiet" -PassThru -Wait
          $v = python -c "from app import config; print(config.VERSION)"
          if (-not (Test-Path $out) -or -not ((Get-Content $out -Raw) -match "v$v")) {
            throw "AntaiPV.exe ne démarre pas correctement (code $($p.ExitCode))"
          }
          Get-Content $out

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = python -c "from app import config; print(config.VERSION)"
          & $iscc /Q "/DAppVersion=$v" installer\AntaiPV.iss
          if ($LASTEXITCODE -ne 0) { throw "Échec de l'installateur" }

      - name: Empreinte SHA-256 et notes de version
        shell: pwsh
        run: |
          foreach ($f in "AntaiPV.exe", "AntaiPV-Setup.exe") {
            $h = (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f" | Out-File -Encoding ascii "dist/$f.sha256"
          }
          python tools/release_notes.py "${{ github.ref_name }}" notes.md

      - name: Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: ANTAI PV ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/AntaiPV-Setup.exe
            dist/AntaiPV-Setup.exe.sha256
            dist/AntaiPV.exe
            dist/AntaiPV.exe.sha256
